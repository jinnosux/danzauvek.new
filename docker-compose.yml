services:
  danzauvek-site:
    build: .
    container_name: danzauvek-site
    restart: unless-stopped
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      # Persist uploaded gallery photos across redeploys.
      - danzauvek_uploads:/app/uploads
      # Persist prijave (volunteer/contact submissions) across redeploys.
      - danzauvek_data:/app/data
    expose:
      - "3000"

volumes:
  danzauvek_uploads:
  danzauvek_data:

networks:
  default:
    name: proxy_net
    external: true
